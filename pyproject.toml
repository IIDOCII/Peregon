[project]
name = "konverter"
version = "0.1.2"
description = "Локальный конвертер файлов для Windows"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "av==19.0.2",
    "charset-normalizer==3.5.2",
    "defusedxml==0.7.1",
    "fpdf2==2.8.9",
    "lxml==6.1.3",
    "magika==1.0.3",
    "markdown==3.11.2",
    "markdownify==1.2.3",
    "openpyxl==3.1.5",
    "pikepdf==10.17.0",
    "pillow==13.0.0",
    "pillow-heif==1.8.1",
    "psutil==7.2.2",
    "puremagic==2.2.0",
    "py7zr==1.1.4",
    "pycryptodomex==3.24.1",
    "pypdfium2==5.14.0",
    "pyside6-essentials==6.12.0",
    "python-docx==1.2.0",
    "rawpy==0.27.1",
    "resvg-py==0.5.0",
]

[project.scripts]
konverter = "konverter:main"

[project.gui-scripts]
konverter-gui = "konverter:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller==6.22.3",
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
